{% extends "base.html" %}

{% block content %}

{% if not request.user.is_authenticated %}
<div style="margin-top: 30px;">
    <form method="POST">{% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>you are now registered. would you like to <a href="/login">login</a>?</p>
</div>
{% else %}
<p>You are already logged-in and can not register. would you like to <a href="/logout/">logout</a>?  </p>

{% endif%}


{% endblock content %}
