<H1>{{object.name}}</H1>
{% if object.get_edit_url %}
<small>
    <a href='{{object.get_edit_url}}'>edit</a>
    <a href='{{object.get_delete_url}}' hx-post="{{object.get_delete_url}}" 
        hx-confirm="Are you sure, you wanna delete {{object.name}}"
        hx-trigger="click"
        >delete</a>
</small>    
{% endif %}

<p>Author: {{object.user.username}}</p>
<p>{{object.description}}</p>
<p>{{object.directions}}</p>

{% for ingredient in object.get_ingredient_list %}
    <h2>{{ingredient.name}}</h2>
    <h3>{{ingredient.as_mks}}</h3>
    <h3>{{ingredient.as_imperial}}</h3>
{% endfor %}
